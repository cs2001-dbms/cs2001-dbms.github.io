<script type="module">
(function() {
  const path = window.location.pathname.toLowerCase();
  const isWeek2Or3 = path.includes('week_2') || path.includes('week_3') || path.includes('nested_subqueries') || path.includes('joins') || path.includes('intermediate_sql') || path.includes('advanced_sql') || path.includes('sql_examples');
  
  if (isWeek2Or3 || document.querySelector('.ds')) {
    const offset = document.querySelector('meta[name="quarto:offset"]')?.getAttribute('content') || '../../';
    
    // Inject CSS
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = offset + 'assets/sql_runner.css';
    document.head.appendChild(link);

    // Dynamically load runner module
    import(offset + 'assets/sql_runner.js');
  }
})();
</script>
